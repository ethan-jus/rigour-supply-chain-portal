# 假定 Nginx、Gateway 和 IAM 在同一台 Linux 主机上。
# 若 Nginx 在容器中，须将 proxy_pass 改为容器内可达的后端地址。
server {
    listen 5100;
    server_name 8.140.247.79;
    root /var/www/rigour-portal;
    index index.html;
    client_max_body_size 50m;

    location ~ ^/auth/(scdp/(session|login|logout)|oauth2/(authorize|token|jwks)|\.well-known/openid-configuration)$ {
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:26881;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /auth;
        proxy_redirect ~^(?:https?://[^/]+)?/login(?:\?.*)?$ "/#/login?reason=reauthenticate";
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    location /auth/ {
        return 404;
    }

    location /api/ {
        # 不加末尾斜线：Gateway 需要完整的 /api/v1/... 路径。
        proxy_pass http://127.0.0.1:26880;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # /oidc/callback 也需要返回 SPA 入口。
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
